<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cook-IT</title>
    <style>
      /* Make the entire body draggable */
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: transparent; /* Ensure the background is fully transparent */
        overflow: hidden; /* Prevent overflow */
        -webkit-app-region: drag; /* Allow dragging the entire window */
      }

      /* Exclude specific elements like buttons from being draggable */
      .no-drag {
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Your existing content, including the close button -->
    </div>
    <script src="./build/bundle.js"></script>
  </body>
</html>
